name: Cleanup Old Workflow Runs
on:
  workflow_dispatch:  # 手动触发

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch all workflow runs
        id: fetch-runs
        run: |
          # 获取当前仓库的所有 Workflow Runs（排除当前运行的 Workflow）
          RUNS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100" \
            | jq -r '.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id')

          # 删除所有匹配的 Workflow Runs
          for run_id in $RUNS; do
            echo "Deleting run $run_id"
            curl -X DELETE \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
          done